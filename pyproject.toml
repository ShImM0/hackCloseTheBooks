[project]
name = "bankrec"
version = "0.1.0"
description = "Conciliación bancaria — hackathon Close The Books (Grupo Valtermia)"
readme = "README.md"
authors = [
    { name = "Xiang Lin", email = "xilin01@ucm.es" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6.0",
    "duckdb>=2.0.0",
    "fastexcel>=0.21.0",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pymupdf>=2.1",
    "rapidfuzz>=3.14.6",
    "regex>=2026.11.7",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "unidecode>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bankrec"
module-root = ""
